<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minecraft-style Game Hub</title>
  <style>
    :root{
      --bg-color: #86c6ff;
      --dirt: #7a4f2a;
      --grass: #4ca64c;
      --card: #f0f0f0;
      --accent: #3b7a3b;
      --shadow: rgba(0,0,0,0.25);
      --accent-dark: #2f5f2f;
    }
    html,body{height:100%;margin:0;font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;background: linear-gradient(#86c6ff 0%, #87d1ff 50%, #cfefff 100%); color:#111;}
    /* Pixel / blocky header */
    header{
      display:flex;align-items:center;gap:14px;padding:18px 22px;
      background: linear-gradient(180deg,var(--grass), #3f8f3f);
      box-shadow: 0 6px 0 var(--dirt), 0 8px 16px rgba(0,0,0,0.15);
      color: white;
    }
    .logo{
      display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;
      text-transform:uppercase;letter-spacing:1px;
    }
    .logo .block{
      width:48px;height:48px;background: linear-gradient(180deg,#9b6d2f,#6f4924);
      border:4px solid #caa16f; box-shadow: inset 0 -6px 0 rgba(0,0,0,0.12);
      display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;
      font-size:20px;
    }

    main{max-width:1100px;margin:28px auto;padding:0 18px;}

    .intro{
      display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;
    }
    .intro .title{
      font-size:28px;font-weight:700;color:var(--accent-dark);
    }
    .intro p{margin:6px 0 0;color:#0b3a0b;opacity:0.9}

    .game-grid{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;
    }
    .card{
      background:linear-gradient(180deg,var(--card), #e6e6e6);
      border:6px solid #cfcfcf;border-bottom-width:12px;border-radius:6px;
      padding:8px;box-shadow: 0 6px 0 var(--shadow);
      display:flex;flex-direction:column;gap:8px;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .card:hover{transform:translateY(-6px);box-shadow:0 14px 26px rgba(0,0,0,0.18);}
    .thumb{
      height:120px;background:linear-gradient(180deg,#ddd,#bbb);border-radius:4px;overflow:hidden;
      display:flex;align-items:center;justify-content:center;font-weight:700;color:#666;
    }
    .card h3{margin:0;font-size:16px;color:#333}
    .card p{margin:0;color:#555;font-size:13px}
    .card .meta{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}
    .btn{
      background: linear-gradient(180deg,var(--accent), var(--accent-dark));
      color:white;padding:8px 12px;border-radius:6px;border:none;cursor:pointer;font-weight:700;
      box-shadow: 0 4px 0 rgba(0,0,0,0.18);text-transform:uppercase;font-size:12px;
    }
    .btn.secondary{background:#ddd;color:#222;box-shadow:none;text-transform:none;font-weight:600;padding:6px 10px}
