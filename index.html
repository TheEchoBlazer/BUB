<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minecraft-style Game Hub</title>
  <style>
    :root{ --grass: #4ca64c; --dirt: #7a4f2a; }
    html,body{height:100%;margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#86c6ff 0%,#cfefff 100%);color:#111;}
    header{display:flex;align-items:center;gap:14px;padding:18px 22px;background:linear-gradient(180deg,var(--grass),#3f8f3f);box-shadow:0 6px 0 var(--dirt);color:white;}
    .logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;cursor:pointer;}
    .logo .block{width:48px;height:48px;background:linear-gradient(180deg,#9b6d2f,#6f4924);border:4px solid #caa16f;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;}

    .btn{background:linear-gradient(180deg,#4caf50,#357a38);border:3px solid #2e6b2e;color:white;padding:10px 20px;border-radius:4px;cursor:pointer;font-weight:700;}
    .btn:hover{transform:translateY(-2px);}

    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:20000;}
    .panel{background:#1a1a1a;border:8px solid #4ca64c;padding:20px;width:95%;max-width:1200px;height:90vh;border-radius:8px;color:white;display:flex;flex-direction:column;}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
    iframe{flex:1;border:0;background:#000;width:100%;}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:10px;}
    .card{background:#222;border:4px solid #4ca64c;padding:12px;border-radius:6px;text-align:center;}
  </style>
</head>
<body>

  <!-- PASSWORD LOCK -->
  <div id="lockScreen">
    <div style="background:#1a1a1a;border:8px solid #4ca64c;padding:40px 50px;border-radius:8px;text-align:center;max-width:360px;width:90%;">
      <h2 style="color:#4ca64c;">🔒 BUB HUB</h2>
      <p>Enter password to continue</p>
      <div style="position:relative;width:100%;margin:15px 0;">
        <input type="password" id="passInput" placeholder="Password" style="width:100%;padding:16px 50px 16px 16px;font-size:20px;background:#222;color:white;border:5px solid #4ca64c;">
        <button onclick="togglePassword()" style="position:absolute;right:15px;top:50%;transform:translateY(-50%);background:none;border:none;color:#4ca64c;font-size:24px;cursor:pointer;">👁</button>
      </div>
      <button onclick="checkPassword()" class="btn">UNLOCK HUB</button>
      <p id="lockMsg" style="color:#ff6666;margin-top:10px;"></p>
    </div>
  </div>

  <header>
    <div class="logo" onclick="secretAdminClick()">
      <div class="block">B</div>
      <div>BUB Hub</div>
    </div>
  </header>

  <main style="max-width:1200px;margin:40px auto;padding:0 20px;">
    <h2 style="text-align:center;color:#2f5f2f;">🎮 Your Local Games</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;">
      <div class="card" data-path="games/kdata.html" onclick="openLocalGame(this)"><div class="thumb">kdata</div><h3>Kdata Game Hub</h3></div>
      <div class="card" data-path="games/thegub.html" onclick="openLocalGame(this)"><div class="thumb">thegub</div><h3>thegub</h3></div>
      <div class="card" data-path="games/thehub.html" onclick="openLocalGame(this)"><div class="thumb">thehub</div><h3>thehub</h3></div>
      <div class="card" data-path="games/myai.html" onclick="openLocalGame(this)"><div class="thumb" style="background:#0f0f0f;color:#0f0;">🤖</div><h3>MyAI - Echo</h3></div>
    </div>
  </main>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="overlay">
    <div class="panel">
      <div class="topbar">
        <h2>🔧 ADMIN PANEL</h2>
        <button onclick="hideAdmin()" style="background:#ff5f5f;padding:8px 16px;">Close</button>
      </div>
      <a href="https://webhook.site/#!/view/90fcfad4-f313-4506-ac1c-1fb1a292031c" target="_blank" style="color:#4ca64c;">👉 View Live Visitor Logs</a>
    </div>
  </div>

  <!-- PROXIES / PREMIUM VIEWER -->
  <div id="viewer" class="overlay">
    <div class="panel">
      <div class="topbar">
        <h2 id="viewerTitle">Loading...</h2>
        <button onclick="closeViewer()" style="background:#ff5f5f;padding:8px 16px;">Close</button>
      </div>
      <iframe id="viewerFrame"></iframe>
    </div>
  </div>

  <script>
    const DEFAULT_PASS = "GuessThePassword";
    const ADMIN_PASS = "SubcribeTo@TheEchoBlazer";
    let clickCount = 0;

    function checkPassword(){
      const input = document.getElementById('passInput').value.trim();
      if(input === DEFAULT_PASS || input === localStorage.getItem('bubhub_pass')){
        localStorage.setItem('bubhub_pass', input);
        document.getElementById('lockScreen').style.display = 'none';
      } else {
        document.getElementById('lockMsg').textContent = "❌ Wrong password!";
        setTimeout(() => document.getElementById('lockMsg').textContent = "", 2000);
      }
    }

    function togglePassword(){
      const input = document.getElementById('passInput');
      const btn = input.parentElement.querySelector('button');
      input.type = input.type === "password" ? "text" : "password";
      btn.textContent = input.type === "password" ? "👁" : "🙈";
    }

    function openLocalGame(el){
      const path = el.getAttribute('data-path');
      if(path) window.open(path, '_blank');
    }

    // Secret Admin (click logo 5 times)
    function secretAdminClick(){
      clickCount++;
      if(clickCount >= 5){
        const pass = prompt("Enter Admin Password:");
        if(pass === ADMIN_PASS){
          document.getElementById('adminPanel').style.display = 'flex';
        } else {
          alert("❌ Wrong admin password!");
        }
        clickCount = 0;
      }
      setTimeout(() => clickCount = 0, 2500);
    }

    function hideAdmin(){ document.getElementById('adminPanel').style.display = 'none'; }

    // Open any link inside the viewer (same tab)
    function openInViewer(title, url){
      document.getElementById('viewerTitle').textContent = title;
      document.getElementById('viewerFrame').src = url;
      document.getElementById('viewer').style.display = 'flex';
    }

    function closeViewer(){
      document.getElementById('viewerFrame').src = 'about:blank';
      document.getElementById('viewer').style.display = 'none';
    }

    // Admin can open proxies/premium here
    function showProxies(){
      hideAdmin();
      // Example: Open one proxy by default, or you can add buttons inside admin
      openInViewer("CroxyProxy", "https://www.croxyproxy.com/");
    }

    function showPremium(){
      hideAdmin();
      openInViewer("Unblocked Games 77", "https://sites.google.com/site/unblockedgames77/");
    }

    // Auto logging
    async function autoLogVisitor() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const { ip } = await res.json();
        await fetch('https://webhook.site/90fcfad4-f313-4506-ac1c-1fb1a292031c', {
          method: 'POST',
          body: JSON.stringify({time: new Date().toLocaleString(), ip: ip, page: "Main Hub"}),
          mode: 'no-cors'
        });
      } catch(e){}
    }

    window.addEventListener('load', () => {
      autoLogVisitor();
      if(localStorage.getItem('bubhub_pass')){
        document.getElementById('lockScreen').style.display = 'none';
      }
    });
  </script>
</body>
</html>
