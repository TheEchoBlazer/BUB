<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BUB Hub</title>
  <style>
    :root { --glow: #4ade80; }
    * { box-sizing: border-box; }
    html,body {
      height:100%; margin:0; padding:0;
      font-family: system-ui, sans-serif;
      background: linear-gradient(180deg, #1e3a8a, #3b82f6);
      color: #fff;
      overflow: hidden;
    }

    .lock { position:fixed; inset:0; background:rgba(0,0,0,0.97); display:flex; align-items:center; justify-content:center; z-index:10000; }
    .box { background:#1f2528; border:10px solid var(--glow); padding:50px 40px; border-radius:16px; text-align:center; max-width:420px; width:90%; box-shadow:0 0 60px rgba(74,222,128,0.9); }
    input { width:100%; padding:18px; font-size:22px; background:#111; color:white; border:6px solid var(--glow); border-radius:8px; margin-bottom:20px; }
    button { width:100%; padding:16px; font-size:18px; font-weight:bold; background:#4ade80; color:black; border:none; border-radius:8px; cursor:pointer; }

    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px; padding:40px; max-width:1300px; margin:auto; }
    .card { background:#272d31; border:6px solid #4ade80; padding:30px; border-radius:12px; text-align:center; cursor:pointer; transition:0.3s; }
    .card:hover { transform:scale(1.08); border-color:#fbbf24; }
  </style>
</head>
<body>

  <!-- LOCK SCREEN -->
  <div id="lockScreen" class="lock">
    <div class="box">
      <h2>🔒 BUB HUB</h2>
      <p>Enter your password to continue</p>
      <input type="password" id="passInput" placeholder="Password" autofocus>
      <button onclick="checkPassword()">UNLOCK HUB</button>
      <p id="msg" style="color:#ff6666; margin-top:15px; min-height:24px;"></p>
      <small style="color:#666;">Emergency: <b>Emergency123!</b></small>
    </div>
  </div>

  <!-- HEADER -->
  <header style="background:#4a9c4a; padding:20px; text-align:center; font-size:28px; font-weight:bold; cursor:pointer;" onclick="adminClick()">
    BUB Hub
  </header>

  <!-- MAIN CONTENT -->
  <main id="mainContent" style="display:none; padding:40px; text-align:center;">
    <h2>🎮 Your Local Games</h2>
    <div class="grid">
      <div class="card" onclick="openGame('games/kdata.html')">Kdata Game Hub</div>
      <div class="card" onclick="openGame('games/thegub.html')">thegub</div>
      <div class="card" onclick="openGame('games/thehub.html')">thehub</div>
      <div class="card" onclick="openGame('games/myai.html')">MyAI - Echo</div>
    </div>
  </main>

  <script>
    const ADMIN_PASS = "NewAdmin123!";
    const EMERGENCY_PASS = "Emergency123!";

    function checkPassword() {
      const input = document.getElementById("passInput").value.trim();
      const msg = document.getElementById("msg");

      if (input === ADMIN_PASS || input === EMERGENCY_PASS) {
        localStorage.setItem("bubhub_logged_in", "true");
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
      } else {
        msg.textContent = "❌ Wrong password!";
        setTimeout(() => msg.textContent = "", 2500);
      }
    }

    function adminClick() {
      let count = parseInt(sessionStorage.getItem("clickCount") || "0") + 1;
      sessionStorage.setItem("clickCount", count);
      if (count >= 5) {
        const pass = prompt("Enter Admin Password:");
        if (pass === ADMIN_PASS || pass === EMERGENCY_PASS) {
          window.location.href = "admin.html";
        } else {
          alert("Wrong admin password");
        }
        sessionStorage.setItem("clickCount", "0");
      }
    }

    function openGame(path) {
      window.open(path, "_blank");
    }

    window.onload = () => {
      if (localStorage.getItem("bubhub_logged_in") === "true") {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
      }
    };
  </script>
</body>
</html>
