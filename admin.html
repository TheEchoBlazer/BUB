<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Panel - BUB Hub</title>
  <style>
    body {
      margin:0; padding:20px;
      background: linear-gradient(180deg, #1e3a8a, #3b82f6);
      font-family: system-ui, sans-serif;
      color: white;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: #1f2528;
      border: 10px solid #4ade80;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 0 40px rgba(74, 222, 128, 0.6);
    }
    input, button {
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
    }
    button {
      background: #4ade80;
      color: black;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .user-item {
      background: #2a2f34;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border-left: 5px solid #4ade80;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .red { background: #ff6666; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 ADMIN PANEL</h1>
    <a href="index.html" style="color:#4ade80;">← Back to Hub</a>

    <h2>Emergency Password Reminder</h2>
    <p><strong>Emergency123!</strong></p>

    <hr>

    <h2>Guest Password</h2>
    <input type="text" id="guestPass" placeholder="Guest Password" value="guest123">
    <label><input type="checkbox" id="guestEnabled"> Enable Guest Mode</label>
    <button onclick="saveGuest()">Save Guest Settings</button>

    <h2>Add New Friend (Limited Uses)</h2>
    <input type="text" id="friendName" placeholder="Friend Name">
    <input type="text" id="friendPass" placeholder="Password">
    <input type="number" id="maxUses" value="20" placeholder="Max Uses">
    <button onclick="addFriend()">Add Friend</button>

    <h2>Registered Friends</h2>
    <div id="usersList"></div>
  </div>

  <script>
    function getUsers() {
      return JSON.parse(localStorage.getItem('bubhub_users') || '[]');
    }

    function saveUsers(users) {
      localStorage.setItem('bubhub_users', JSON.stringify(users));
      renderUsers();
    }

    function addFriend() {
      const name = document.getElementById('friendName').value.trim();
      const pass = document.getElementById('friendPass').value.trim();
      const max = parseInt(document.getElementById('maxUses').value) || 10;

      if (!name || !pass) return alert("Name and Password required!");

      const users = getUsers();
      users.push({ name, password: pass, maxUses: max, used: 0 });
      saveUsers(users);

      document.getElementById('friendName').value = '';
      document.getElementById('friendPass').value = '';
    }

    function renderUsers() {
      const list = document.getElementById('usersList');
      const users = getUsers();
      list.innerHTML = '';

      if (users.length === 0) {
        list.innerHTML = '<p>No friends added yet.</p>';
        return;
      }

      users.forEach((user, index) => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.innerHTML = `
          <div>
            <strong>${user.name}</strong> — ${user.password}<br>
            <small>Uses: ${user.used}/${user.maxUses}</small>
          </div>
          <button class="red" onclick="removeFriend(${index})">Remove</button>
        `;
        list.appendChild(div);
      });
    }

    function removeFriend(index) {
      if (confirm("Remove this friend?")) {
        let users = getUsers();
        users.splice(index, 1);
        saveUsers(users);
      }
    }

    function saveGuest() {
      const pass = document.getElementById('guestPass').value.trim();
      const enabled = document.getElementById('guestEnabled').checked;
      localStorage.setItem('bubhub_guest_pass', pass);
      localStorage.setItem('bubhub_guest_enabled', enabled);
      alert("Guest settings saved!");
    }

    // Load on start
    window.onload = () => {
      renderUsers();
      document.getElementById('guestPass').value = localStorage.getItem('bubhub_guest_pass') || 'guest123';
      document.getElementById('guestEnabled').checked = localStorage.getItem('bubhub_guest_enabled') === 'true';
    };
  </script>
</body>
</html>
